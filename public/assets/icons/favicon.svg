  <!-- popcorn pile -->
  <circle cx="24" cy="27" r="5" fill="#fffdf5"/>
  <circle cx="30" cy="21" r="6" fill="#fffdf5"/>
  <circle cx="37" cy="22" r="5.5" fill="#fffdf5"/>
